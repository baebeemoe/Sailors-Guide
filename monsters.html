<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Star Sailors Monster database - UR, SSR, SR and R Monsters"><title>Monsters | Beemoe's Guide</title><link rel="stylesheet" href="./css/base.css?v=11"><link rel="stylesheet" href="./css/retro-theme.css?v=11"><link rel="stylesheet" href="./css/layout-fix.css?v=13"><link rel="stylesheet" href="./css/anime-glass-theme.css?v=11"><style>.monster-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.monster-filter{border:1px solid rgba(255,255,255,.16);background:rgba(12,17,28,.72);color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}.monster-filter.active{border-color:#f5bd4c;box-shadow:0 0 0 1px rgba(245,189,76,.25) inset}.monster-db{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.monster-card{position:relative;overflow:hidden;min-height:390px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:linear-gradient(180deg,rgba(28,32,45,.9),rgba(10,13,21,.96));padding:14px}.monster-card[data-rarity=UR]{border-color:rgba(255,139,43,.58)}.monster-card[data-rarity=SSR]{border-color:rgba(245,189,76,.52)}.monster-card[data-rarity=SR]{border-color:rgba(168,92,255,.62);box-shadow:inset 0 0 24px rgba(130,61,210,.05)}.monster-card[data-rarity=R]{border-color:rgba(93,153,255,.55);box-shadow:inset 0 0 24px rgba(60,105,190,.05)}.monster-art{height:250px;display:flex;align-items:center;justify-content:center}.monster-art img{width:100%;height:100%;object-fit:contain}.monster-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}.rarity{font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px}.rarity.UR{background:#f07d27;color:#fff}.rarity.SSR{background:#c69227;color:#fff}.rarity.SR{background:#7d3fc7;color:#fff}.rarity.R{background:#416fbd;color:#fff}.monster-card h2{font-size:18px;margin:10px 0 6px}.monster-card p{font-size:13px;line-height:1.45;opacity:.76;margin:0}.monster-element{font-size:12px;opacity:.75}body>.wrap:after{margin-top:32px!important}</style></head><body><header class="topbar"><a class="logo" href="index.html"><span>✦</span> BEEMOE'S GUIDE</a><button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button><nav id="navLinks"><a href="announcements.html">Announcements</a><a href="index.html">Characters</a><a class="active" href="monsters.html">Monsters</a><a href="team-builder.html">Team Builder</a><a href="memory-pieces.html">Memory Pieces</a><a href="gear.html">Gear</a><a href="https://argasaragih.com/star-sailors/artifacts" target="_blank" rel="noopener noreferrer" title="Open external Artifact guide">Artifacts ↗</a><a href="codes.html">Codes</a></nav></header><main class="wrap"><section class="page-head"><p class="eyebrow">MONSTER DATABASE</p><h1>Star Sailors Monsters</h1><p>Browse the Monster roster by rarity.</p></section><div class="monster-toolbar"><button class="monster-filter active" data-rarity="all">All</button><button class="monster-filter" data-rarity="UR">UR</button><button class="monster-filter" data-rarity="SSR">SSR</button><button class="monster-filter" data-rarity="SR">SR</button><button class="monster-filter" data-rarity="R">R</button></div><section id="monsterGrid" class="monster-db"></section></main><script src="./data/monsters.js?v=5"></script><script>const grid=document.getElementById('monsterGrid');const available=monsterData.filter(m=>['UR','SSR','SR','R'].includes(m.rarity));function render(r='all'){grid.innerHTML=available.filter(m=>r==='all'||m.rarity===r).map(m=>`<article class="monster-card" data-rarity="${m.rarity}"><div class="monster-art"><img src="${m.image}" alt="${m.name}" loading="lazy"></div><div class="monster-meta"><span class="rarity ${m.rarity}">${m.rarity}</span><span class="monster-element">${m.element}</span></div><h2>${m.name}</h2><p>${m.note||'Monster details are being verified.'}</p></article>`).join('')}document.querySelectorAll('.monster-filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.monster-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.rarity)}));render();document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('navLinks')?.classList.toggle('open'));</script><div style="position:fixed;right:10px;bottom:10px;z-index:9999;font:700 10px/1.2 system-ui;padding:5px 7px;border-radius:8px;background:rgba(8,11,18,.62);color:#77aaff;border:1px solid rgba(93,153,255,.3)">BUILD MONSTERS-1.5</div></body></html>
